<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>面接 填空練習</title>
<style>
:root{--bg:#f6f5f2;--card:#fff;--ink:#1d1d1f;--sub:#6b6b70;--line:#e3e1dc;--acc:#1f5eff;--acc-ink:#fff;
--ok:#1a7f37;--okbg:#e6f4ea;--mid:#8a5a00;--midbg:#fff1cc;--ng:#c62828;--ngbg:#fdecea}
@media (prefers-color-scheme: dark){:root:not([data-theme=light]){--bg:#141416;--card:#1e1e21;--ink:#ececef;--sub:#a0a0a8;--line:#303036;
--acc:#6f9bff;--acc-ink:#0b1020;--ok:#5cc47a;--okbg:#16301f;--mid:#e6b64f;--midbg:#352a12;--ng:#ff7b72;--ngbg:#3a1a1a}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font:17px/1.65 -apple-system,BlinkMacSystemFont,"Hiragino Sans","PingFang SC","Noto Sans JP",sans-serif;-webkit-text-size-adjust:100%}
main{max-width:680px;margin:0 auto;padding:16px 16px 56px}
h1{font-size:21px;margin:6px 0 2px}
a{color:var(--acc)}
.sub{color:var(--sub);font-size:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin:12px 0}
button{font:inherit;border:0;border-radius:12px;padding:13px 16px;background:var(--acc);color:var(--acc-ink);cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
button.ghost{background:transparent;color:var(--acc);border:1px solid var(--line)}
button:disabled{opacity:.4;cursor:default}
.col{display:flex;flex-direction:column;gap:10px}
.row{display:flex;gap:10px}
.row>button{flex:1}
.big{display:block;width:100%;padding:16px;font-size:18px;margin-top:12px}
.menu button{text-align:left;display:flex;justify-content:space-between;align-items:center}
.menu .n{font-size:14px;opacity:.85}
.top{display:flex;justify-content:space-between;align-items:center;font-size:14px;color:var(--sub)}
.top button{padding:6px 10px;font-size:14px}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin:8px 0 4px}
.bar>i{display:block;height:100%;background:var(--acc);transition:width .2s}
.listen{text-align:center;padding:18px 16px}
.listen .hint{color:var(--sub);font-size:14px;margin-top:4px}
.q{font-size:19px;font-weight:600;margin:2px 0}
.zh{font-size:14px;color:var(--sub)}
.label{font-size:13px;color:var(--sub);margin:14px 0 6px}
/* 填空 */
.fill{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 12px 4px;margin:12px 0}
.ln{display:flex;flex-wrap:wrap;align-items:flex-end;gap:10px 3px;margin:0 0 14px;font-size:18px}
.p{padding-bottom:6px;line-height:1.3;white-space:pre}
.b{display:inline-flex;flex-direction:column;gap:2px;max-width:100%}
.h{font-size:12px;line-height:1.25;color:var(--sub);cursor:pointer;user-select:none;-webkit-user-select:none}
.h.more{color:var(--acc)}
.b input{font:inherit;font-size:17px;padding:4px 6px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);max-width:100%}
.b input:focus{outline:2px solid var(--acc);outline-offset:0;background:var(--card)}
.r{display:inline-flex;flex-direction:column;border-radius:8px;padding:2px 7px;line-height:1.35}
.r small{font-size:11px;color:var(--sub)}
.r s{font-size:14px;color:var(--ng)}
.r.ok{background:var(--okbg)} .r.ok2{background:var(--midbg)} .r.ng{background:var(--ngbg)}
.verdict{font-size:19px;font-weight:700;margin:0 0 4px}
.v-ok{color:var(--ok)} .v-ng{color:var(--ng)}
.small{font-size:13px;color:var(--sub)}
ul.wrong{margin:6px 0 0;padding-left:20px}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--sub);margin:4px 0 0}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:-1px}
</style>
</head>

function replaceMap(arr, M) {
  const out = []; let i = 0;
  while (i < arr.length) {
    let hit = null;
    for (let L = Math.min(M.max, arr.length - i); L >= 1; L--) {
      let k = ''; for (let t = i; t < i + L; t++) k += arr[t];

    }
    if (hit) { out.push(...Array.from(hit[1])); i += hit[0]; } else { out.push(arr[i]); i++; }

}

  for (const ch of run) {

      <button data-go="must">一定会问的<span class="n">${a.n} 题${a.wrong ? `・错 ${a.wrong}` : ''}</span></button>
      <button data-go="maybe">可能问的<span class="n">${b.n} 题${b.wrong ? `・错 ${b.wrong}` : ''}</span></button>
      <button data-go="all">全部<span class="n">${all.n} 题・${nb} 个空</span></button>
      <button data-go="wrong" class="ghost" ${all.wrong ? '' : 'disabled'}>只练错的<span class="n">${all.wrong} 题</span></button>
    </div>
    <div class="card">
      <div class="row"><button class="ghost" id="test">试听声音</button></div>
      <div class="small" style="margin-top:8px">${canSpeak ? 'iPhone 没声音的话，看看手机侧面的静音开关。' : '这个浏览器不能朗读，题目会直接显示文字。'}</div>
    </div>
    <div class="small">回答来自练习稿（${esc(DATA.built)} 生成）。对错记录只存在这台设备上。<a href="mensetsu.html">单词页</a></div>`;
  document.querySelectorAll('[data-go]').forEach(b => b.onclick = () => start(b.dataset.go));
  $('#test').onclick = () => speak('大阪経済大学を志望した理由を教えてください。');
}
function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function start(kind) {
  let its = DATA.items;
  if (kind === 'must' || kind === 'maybe') its = its.filter(it => it.g === kind);
  if (kind === 'wrong') its = its.filter(it => store[it.id] && store[it.id].ok === false);
  if (!its.length) return home();
  S = {kind, queue: shuffle(its.map(it => it.id)), pos: 0, again: {}, firstTry: {}};
  ask();
}
function header() {
  const total = S.queue.length, pct = Math.round(S.pos / total * 100);
  return `<div class="top"><span>第 ${S.pos + 1} 题 / 共 ${total} 题</span><button class="ghost" id="quit">回首页</button></div>
    <div class="bar"><i style="width:${pct}%"></i></div>`;
}
function ask() {
  const it = byId[S.queue[S.pos]];
  let k = 0;
  const lines = it.lines.map(line => `<div class="ln">${line.map(p => p[0] === 't'
      ? `<span class="p">${esc(p[1])}</span>`
      : `<label class="b"><span class="h" data-k="${k}">${esc(p[2])}</span><input data-k="${k++}" style="width:${boxWidth(p[1])}em" lang="ja" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" enterkeyhint="next"></label>`
    ).join('')}</div>`).join('');
  $('#app').innerHTML = header() + `
    <div class="card listen">
      ${canSpeak ? `<div class="q">（听题目）</div><div class="hint">题目只播放声音，交卷后才显示文字</div>`
                 : `<div class="q">${esc(it.q)}</div>`}
      <div class="row" style="margin-top:12px">
        <button class="ghost" id="replay" ${canSpeak ? '' : 'disabled'}>再听一遍</button>
        <button class="ghost" id="slow" ${canSpeak ? '' : 'disabled'}>慢速再听</button>
      </div>
    </div>
    <div class="fill">${lines}</div>
    <div class="row">
      <button class="ghost" id="giveup">不会，看答案</button>
      <button id="submit">交卷</button>
    </div>`;
  const bl = blanksOf(it), inputs = [...document.querySelectorAll('.b input')];
  document.querySelectorAll('.h').forEach(h => h.onclick = e => {
    e.preventDefault();
    const b = bl[+h.dataset.k];
    if (!h.classList.contains('more')) { h.classList.add('more'); h.textContent = `${b[2]} · ${firstChar(b[1])}…`; }
    inputs[+h.dataset.k].focus();
  });
  inputs.forEach((inp, i) => inp.addEventListener('keydown', e => {
    if (e.key !== 'Enter' || e.isComposing || e.keyCode === 229) return;
    e.preventDefault();
    if (i + 1 < inputs.length) inputs[i + 1].focus(); else $('#submit').focus();
  }));
  $('#quit').onclick = home;
  $('#replay').onclick = () => speak(it.q, 1);
  $('#slow').onclick = () => speak(it.q, 0.7);
  $('#giveup').onclick = () => result(it, [], true);
  $('#submit').onclick = () => {
    const vals = inputs.map(x => x.value.trim());
    if (vals.every(v => !v)) { inputs[0].focus(); return; }
    result(it, vals, false);
  };
  speak(it.q, 1);
}
function result(it, vals, gaveUp) {
  if (canSpeak) speechSynthesis.cancel();
  const bl = blanksOf(it);
  const g = bl.map((b, i) => ({b, mine: vals[i] || '', level: gaveUp ? 'ng' : judge(b[1], vals[i] || '')}));
  const nOk = g.filter(x => x.level !== 'ng').length, pass = nOk === g.length;
  if (!(it.id in S.firstTry)) S.firstTry[it.id] = pass;
  store[it.id] = {ok: pass, n: ((store[it.id] && store[it.id].n) || 0) + 1, t: Date.now()};
  save();
  let requeued = false;
  if (!pass && (S.again[it.id] || 0) < 2) {
    S.again[it.id] = (S.again[it.id] || 0) + 1;
    S.queue.splice(Math.min(S.pos + 4, S.queue.length), 0, it.id);
    requeued = true;
  }
  let k = 0;
  const lines = it.lines.map(line => `<div class="ln">${line.map(p => {
    if (p[0] === 't') return `<span class="p">${esc(p[1])}</span>`;
    const x = g[k++];
    const wrongMine = x.level !== 'ok' && x.mine ? `<s>${esc(x.mine)}</s>` : '';
    const rd = HAS_KANJI.test(p[1]) ? `<small>${esc(rubyOf(p[1]))}</small>` : '';
    return `<span class="b"><span class="h">${esc(p[2])}</span><span class="r ${x.level}">${wrongMine}${esc(p[1])}${rd}</span></span>`;
  }).join('')}</div>`).join('');
  $('#app').innerHTML = header() + `
    <div class="card">
      <div class="verdict ${pass ? 'v-ok' : 'v-ng'}">${pass ? '过了' : '还没记住'}　${nOk} / ${g.length}</div>
      ${requeued ? '<div class="small">这题过几题再考一次。</div>' : ''}
      <div class="label">题目</div><div class="q">${esc(it.q)}</div><div class="zh">${esc(it.zh)}</div>
      <div class="row" style="margin-top:8px"><button class="ghost" id="replay">再听一遍题目</button></div>
    </div>
    <div class="fill">${lines}
      <div class="legend" style="margin-bottom:12px"><span><i style="background:var(--okbg)"></i>对</span><span><i style="background:var(--midbg)"></i>差一个字（算对）</span><span><i style="background:var(--ngbg)"></i>错／没填（划线的是你写的）</span></div>
    </div>
    <button class="big" id="next">${S.pos + 1 < S.queue.length ? '下一题' : '看这一轮的结果'}</button>`;
  $('#quit').onclick = home;
  $('#replay').onclick = () => speak(it.q, 1);
  $('#next').onclick = () => { S.pos++; if (S.pos < S.queue.length) ask(); else summary(); };
  window.scrollTo(0, 0);
}
function summary() {
  const ids = Object.keys(S.firstTry), first = ids.filter(id => S.firstTry[id]).length;
  const wrong = ids.filter(id => store[id] && store[id].ok === false);
  $('#app').innerHTML = `
    <h1>这一轮结束</h1>
    <div class="card">
      <div class="verdict">一次就过：${first} / ${ids.length} 题</div>
      ${wrong.length ? `<div class="label">最后一次还没过的</div><ul class="wrong">${wrong.map(id => `<li>${esc(byId[id].q)}</li>`).join('')}</ul>`
                     : '<div class="small">全部都过了。</div>'}
    </div>
    <div class="col">
      ${wrong.length ? '<button class="big" id="redo">错的再练一遍</button>' : ''}
      <button class="big ghost" id="home">回首页</button>
    </div>`;
  if (wrong.length) $('#redo').onclick = () => start('wrong');
  $('#home').onclick = home;
}
home();
</script>
</body>
