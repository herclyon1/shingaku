<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>指定校推薦 出願材料</title>
<link rel="manifest" href="momoyama.webmanifest">
<meta name="theme-color" content="#C4405F">
<link rel="apple-touch-icon" href="momoyama-apple-touch.png">
<link rel="icon" href="momoyama-icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="桃山推薦">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@500;700;900&family=Noto+Sans+SC:wght@400;500;700&display=swap">
<style>
:root{
  --bg:#F6F5F1;--panel:#FFFFFF;--ink:#1E2433;--ink2:#5B6272;--line:#E2E0D8;
  --momo:#C4405F;--momo-soft:#FBE9EE;--ok:#2F7D4F;--ok-soft:#E6F3EA;--warn:#A8690F;--warn-soft:#FBF0DC;
  --chip:#EEEDE7;--focus:#2B6CB0;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#15171C;--panel:#1E2128;--ink:#ECEDF0;--ink2:#A3A8B4;--line:#33373F;
    --momo:#E9738E;--momo-soft:#3A2129;--ok:#6CC08B;--ok-soft:#1E3327;--warn:#E3B05A;--warn-soft:#3A2F17;
    --chip:#2A2E36;--focus:#79A8E8;
  }
}
:root[data-theme="dark"]{
  --bg:#15171C;--panel:#1E2128;--ink:#ECEDF0;--ink2:#A3A8B4;--line:#33373F;
  --momo:#E9738E;--momo-soft:#3A2129;--ok:#6CC08B;--ok-soft:#1E3327;--warn:#E3B05A;--warn-soft:#3A2F17;
  --chip:#2A2E36;--focus:#79A8E8;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans SC","Zen Kaku Gothic New",-apple-system,"PingFang SC","Hiragino Sans",sans-serif;font-size:15px;line-height:1.6}
.wrap{max-width:720px;margin:0 auto;padding:14px 12px 80px}
h1{font-family:"Zen Kaku Gothic New","Noto Sans SC",sans-serif;font-weight:900;font-size:24px;margin:6px 0 2px;letter-spacing:.01em;text-wrap:balance}
.sub{color:var(--ink2);font-size:13px;margin:0 0 12px}
.hero{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px 14px 12px;margin-bottom:12px}
.prog{display:flex;align-items:center;gap:10px;margin-top:8px}
.bar{flex:1;height:10px;background:var(--chip);border-radius:6px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--momo);width:0;transition:width .3s}
.pct{font-variant-numeric:tabular-nums;font-weight:700;min-width:64px;text-align:right}
.dates{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:6px;margin-top:10px}
.d{background:var(--chip);border-radius:9px;padding:6px 8px;font-size:12.5px}
.d b{display:block;font-size:14px;font-variant-numeric:tabular-nums}
.d.now{background:var(--momo-soft);color:var(--momo)}
.sync{font-size:12px;color:var(--ink2);margin-top:8px}
.sync.err{color:var(--warn)}
.c-self{--c:#2B6CB0}.c-school{--c:#2F7D4F}.c-family{--c:#A8690F}
.owners{display:flex;gap:6px;margin:0 0 12px;flex-wrap:wrap}
.own-btn{border:1px solid var(--line);background:var(--panel);border-radius:99px;padding:5px 11px;font:inherit;font-size:13px;cursor:pointer;color:var(--ink2);display:flex;align-items:center;gap:6px}
.own-btn b{font-variant-numeric:tabular-nums;color:var(--ink)}
.own-btn i{width:9px;height:9px;border-radius:50%;background:var(--c,var(--ink2));display:block;font-style:normal}
.own-btn[aria-pressed=true]{border-color:var(--c,var(--ink));box-shadow:inset 0 0 0 1px var(--c,var(--ink));color:var(--ink)}
.card.by-self{border-left:5px solid #2B6CB0}
.card.by-school{border-left:5px solid #2F7D4F}
.card.by-family{border-left:5px solid #A8690F}
.card.done.by-self,.card.done.by-school,.card.done.by-family{border-left-color:var(--ok)}
.tag.own{color:#fff;font-weight:700}
.tag.own.self{background:#2B6CB0}
.tag.own.school{background:#2F7D4F}
.tag.own.family{background:#A8690F}
.tabs{display:flex;gap:6px;margin:2px 0 10px}
.tab{flex:1;border:1px solid var(--line);background:var(--panel);color:var(--ink2);border-radius:11px;padding:9px 8px;font:inherit;font-size:14px;font-weight:700;cursor:pointer;text-align:center;line-height:1.3}
.tab small{display:block;font-weight:500;font-size:11.5px;margin-top:2px;font-variant-numeric:tabular-nums}
.tab[aria-selected=true]{background:var(--momo);border-color:var(--momo);color:#fff}
.tab[aria-selected=true] small{color:#fff;opacity:.85}
.legend{font-size:12.5px;color:var(--ink2);margin:0 0 10px}
h2{font-family:"Zen Kaku Gothic New","Noto Sans SC",sans-serif;font-weight:700;font-size:16px;margin:20px 0 8px;display:flex;align-items:baseline;gap:8px}
h2 small{font-weight:500;color:var(--ink2);font-size:12.5px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;margin-bottom:10px;overflow:hidden}
.card.done{border-color:var(--ok)}
.head{display:flex;gap:10px;padding:12px 12px 10px;align-items:flex-start}
.head input[type=checkbox]{width:24px;height:24px;margin:2px 0 0;accent-color:var(--ok);flex:none}
.ttl{flex:1;min-width:0}
.ttl .t{font-weight:700;font-size:15.5px;line-height:1.35}
.card.done .ttl .t{text-decoration:line-through;color:var(--ink2)}
.meta{display:flex;flex-wrap:wrap;gap:4px 6px;margin-top:5px}
.tag{font-size:11.5px;padding:1px 7px;border-radius:99px;background:var(--chip);color:var(--ink2)}
.tag.who{background:var(--momo-soft);color:var(--momo)}
.tag.time{background:var(--warn-soft);color:var(--warn)}
.tag.ok{background:var(--ok-soft);color:var(--ok)}
.tog{flex:none;border:0;background:transparent;color:var(--focus);font-size:13px;padding:4px 2px;cursor:pointer;font-family:inherit}
.body{display:none;padding:0 12px 12px;border-top:1px dashed var(--line)}
.card.open .body{display:block}
.body h4{margin:10px 0 4px;font-size:13px;color:var(--ink2);font-weight:700;letter-spacing:.04em}
.body ol{margin:0;padding-left:22px}
.body ol li{margin:3px 0}
.trap{background:var(--warn-soft);border-radius:9px;padding:8px 10px;margin-top:8px;font-size:14px}
.trap b{color:var(--warn)}
.why{font-size:13.5px;color:var(--ink2)}
.photos{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.ph{position:relative;width:88px;height:88px;border-radius:9px;overflow:hidden;border:1px solid var(--line);background:var(--chip)}
.ph img{width:100%;height:100%;object-fit:cover;display:block;cursor:zoom-in}
.ph button{position:absolute;top:2px;right:2px;width:22px;height:22px;border-radius:50%;border:0;background:rgba(0,0,0,.6);color:#fff;font-size:13px;line-height:22px;padding:0;cursor:pointer}
.up{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:9px;padding:7px 12px;font-size:14px;cursor:pointer;font-family:inherit}
.btn.pri{background:var(--momo);border-color:var(--momo);color:#fff}
.btn:disabled{opacity:.5}
.note{width:100%;margin-top:8px;border:1px solid var(--line);border-radius:9px;padding:7px 9px;font:inherit;font-size:14px;background:var(--bg);color:var(--ink);resize:vertical;min-height:38px}
a{color:var(--focus)}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.lb{position:fixed;inset:0;background:rgba(0,0,0,.9);display:none;align-items:center;justify-content:center;z-index:9;padding:10px}
.lb.on{display:flex}
.lb img{max-width:100%;max-height:100%;object-fit:contain}
.foot{font-size:12px;color:var(--ink2);margin-top:24px;line-height:1.5}
@media (prefers-reduced-motion:reduce){.bar i{transition:none}}
</style>
</head><body>


<div class="wrap">
  <div class="tabs" id="tabs"></div>
  <h1 id="h1"></h1>
  <p class="sub" id="sub"></p>

  <div class="hero">
    <div style="display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap">
      <div><b id="doneN">0</b> / <b id="allN">0</b> 项完成</div>
      <div class="sub" style="margin:0">距 <span id="dlLabel">–</span> 截止还有 <b id="left">–</b> 天</div>
    </div>
    <div class="prog"><div class="bar"><i id="bar"></i></div><span class="pct" id="pct">0%</span></div>
    <div class="dates" id="dates"></div>
    <div class="sync" id="sync">读取本机进度…</div>
    <div class="up"><button class="btn" id="exp">⬇ 导出进度（发给我核对）</button><button class="btn" id="imp">⬆ 导入进度</button></div>
  </div>

  <p class="legend">两所学校的清单各自独立：打勾、备注、照片互不影响。推薦一人一校，最后只会用其中一张。进度存在这台设备的浏览器里；换设备用「导出进度」→「导入」。</p>

  <div class="owners" id="owners"></div>

  <div id="list"></div>

  <div class="foot" id="foot"></div>
</div>

<div class="lb" id="lb" onclick="this.classList.remove('on')"><img id="lbimg" alt="放大查看"></div>

      const ph = photos[it.id]||[];

      html += `<div class="card ${done?'done':''} ${open?'open':''} by-${by[0]}" id="c_${it.id}">

function setSync(msg, err){const el=document.getElementById('sync'); el.textContent=msg; el.className='sync'+(err?' err':'')}

// image compress -> dataURL under ~220 KB
function compress(file){
  return new Promise((res,rej)=>{
    const img = new Image();
    const url = URL.createObjectURL(file);
    img.onload = ()=>{
      URL.revokeObjectURL(url);
      let max = 1200, q = 0.8, out;
      for (let i=0;i<8;i++){
        const r = Math.min(1, max/Math.max(img.width,img.height));
        const w = Math.round(img.width*r), h = Math.round(img.height*r);
        const c = document.createElement('canvas'); c.width=w; c.height=h;
        c.getContext('2d').drawImage(img,0,0,w,h);
        out = c.toDataURL('image/jpeg', q);
        if (out.length < 220*1024) break;
        if (q > 0.55) q -= 0.1; else max = Math.round(max*0.8);
      }
      res(out);
    };
    img.onerror = ()=>rej(new Error('图片读取失败'));
    img.src = url;
  });
}

async function addPhotos(itemId, files){
  for (const f of files){
    if (!f.type.startsWith('image/')) continue;
    setSync('正在压缩…');
    let dataUrl;
    try{ dataUrl = await compress(f); }catch(e){ setSync(e.message,true); continue; }
    const id = itemId+'-'+Date.now()+'-'+Math.floor(Math.random()*1000);
    const doc = {id, item:itemId, dataUrl, ts:Date.now()};
    try{ await idbPut(doc); }catch(e){ setSync('照片保存失败：'+e.message, true); continue; }
    (photos[itemId] ||= []).push(doc); render(); setSync('照片已存到本机 '+new Date().toLocaleTimeString());
  }
}
async function delPhoto(pid){
  if (!confirm('删除这张照片？')) return;
  try{ await idbDel(pid); }catch(e){ setSync('删除失败：'+e.message,true); return; }
  for (const k of Object.keys(photos)) photos[k] = photos[k].filter(p=>p.id!==pid);
  render();
}

// ---- local persistence: localStorage (state) + IndexedDB (photos) ----
function idb(){return new Promise((res,rej)=>{const r=indexedDB.open('momo_docs',1);r.onupgradeneeded=()=>r.result.createObjectStore('photos',{keyPath:'id'});r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);});}
async function idbAll(){try{const d=await idb();return await new Promise((res,rej)=>{const q=d.transaction('photos').objectStore('photos').getAll();q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error);});}catch(e){return null}}
async function idbPut(doc){const d=await idb();return new Promise((res,rej)=>{const q=d.transaction('photos','readwrite').objectStore('photos').put(doc);q.onsuccess=()=>res();q.onerror=()=>rej(q.error);});}
async function idbDel(id){const d=await idb();return new Promise((res,rej)=>{const q=d.transaction('photos','readwrite').objectStore('photos').delete(id);q.onsuccess=()=>res();q.onerror=()=>rej(q.error);});}
async function loadPhotos(){const all=await idbAll();if(all===null){setSync('这个浏览器不支持本地照片存储（隐私模式？）',true);return;}photos={};for(const d of all)(photos[d.item] ||= []).push(d);for(const k of Object.keys(photos))photos[k].sort((a,b)=>a.ts-b.ts);render();setSync('已存在本机 · 照片 '+all.length+' 张 · '+new Date().toLocaleString());}
