<style>

@media (prefers-color-scheme: dark){:root{--bg:#141416;--card:#1e1e21;--ink:#ececef;--sub:#a0a0a8;--line:#303036;

*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font:17px/1.65 -apple-system,BlinkMacSystemFont,"Hiragino Sans","PingFang SC","Noto Sans JP",sans-serif;-webkit-text-size-adjust:100%}
main{max-width:640px;margin:0 auto;padding:16px 16px 56px}
h1{font-size:21px;margin:6px 0 2px}
.sub{color:var(--sub);font-size:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin:12px 0}
button{font:inherit;border:0;border-radius:12px;padding:13px 16px;background:var(--acc);color:var(--acc-ink);cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
button.ghost{background:transparent;color:var(--acc);border:1px solid var(--line)}
button:disabled{opacity:.4;cursor:default}
.col{display:flex;flex-direction:column;gap:10px}
.row{display:flex;gap:10px}
.row>button{flex:1}
.big{display:block;width:100%;padding:16px;font-size:18px;margin-top:12px}
.menu button{text-align:left;display:flex;justify-content:space-between;align-items:center}
.menu .n{font-size:14px;opacity:.85}
textarea{display:block;width:100%;min-height:160px;font:inherit;font-size:18px;line-height:1.6;padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);resize:vertical}
textarea:focus{outline:2px solid var(--acc);outline-offset:1px}
.top{display:flex;justify-content:space-between;align-items:center;font-size:14px;color:var(--sub)}
.top button{padding:6px 10px;font-size:14px}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin:8px 0 4px}
.bar>i{display:block;height:100%;background:var(--acc);transition:width .2s}
.listen{text-align:center;padding:22px 16px}
.listen .hint{color:var(--sub);font-size:14px;margin-top:6px}
.q{font-size:19px;font-weight:600;margin:2px 0}
.label{font-size:13px;color:var(--sub);margin:14px 0 4px}
.chunk{border-radius:10px;padding:10px 12px;margin:8px 0}
.chunk .tag{display:inline-block;font-size:13px;font-weight:700;margin-right:8px}
.chunk .t{font-size:18px}
.c-ok{background:var(--okbg)} .c-ok .tag{color:var(--ok)}
.c-mid{background:var(--midbg)} .c-mid .tag{color:var(--mid)}
.c-ng{background:var(--ngbg)} .c-ng .tag{color:var(--ng)}
.yours{font-size:14px;color:var(--sub);margin-top:2px}
.model{font-size:17px}
.model b{background:var(--mark);font-weight:600;border-radius:4px;padding:0 2px}
.mine{white-space:pre-wrap;font-size:16px}
.verdict{font-size:19px;font-weight:700;margin:0 0 4px}
.v-ok{color:var(--ok)} .v-ng{color:var(--ng)}
.small{font-size:13px;color:var(--sub)}
ul.wrong{margin:6px 0 0;padding-left:20px}
</style>
</head>

/* ---------- 判分用の正規化（元の位置を覚えておく） ---------- */
const PUNCT = /[\s、。，．,.!！?？「」『』（）()\[\]【】・…〜~"'“”‘’：:；;／\/]/u;

function replaceMap(arr, M) {

    for (let L = Math.min(M.max, arr.length - i); L >= 1; L--) {

function grade(item, answer) {
  const A = norm(answer);
  return item.chunks.map(t => {
    const C = norm(t).s;
    const r = bestMatch(C, A.s);
    const sim = C.length ? 1 - r.d / C.length : 1;
    let mine = '';
    if (r.je > r.js && A.m.length) mine = answer.slice(A.m[r.js].os, A.m[r.je - 1].oe);
    const level = r.d === 0 ? 'ok' : sim >= 0.85 ? 'ok2' : sim >= 0.5 ? 'mid' : 'ng';
    return {t, level, mine};
  });
}

/* ---------- 画面 ---------- */
let S = null; // {queue, pos, again:{id:count}, firstTry:{id:bool}, answer}
function counts(g) {
  const its = DATA.items.filter(it => !g || it.g === g);
  return {n: its.length, wrong: its.filter(it => store[it.id] && store[it.id].ok === false).length};
}
function home() {
  if (canSpeak) speechSynthesis.cancel();
  const a = counts('must'), b = counts('maybe'), all = counts(null);
  $('#app').innerHTML = `
    <h1>校長面接 問答練習</h1>
    <div class="sub">听问题，用日语打字回答。判分看的是稿子里粗体所在的整句片段，不是单个词。</div>
    <div class="card col menu">
      <button data-go="must">一定会问的<span class="n">${a.n} 题${a.wrong ? `・错 ${a.wrong}` : ''}</span></button>
      <button data-go="maybe">可能问的<span class="n">${b.n} 题${b.wrong ? `・错 ${b.wrong}` : ''}</span></button>
      <button data-go="all">全部<span class="n">${all.n} 题</span></button>
      <button data-go="wrong" class="ghost" ${all.wrong ? '' : 'disabled'}>只练错的<span class="n">${all.wrong} 题</span></button>
    </div>
    <div class="card">
      <div class="row"><button class="ghost" id="test">试听声音</button></div>
      <div class="small" style="margin-top:8px">${canSpeak ? 'iPhone 没声音的话，看看手机侧面的静音开关。' : '这个浏览器不能朗读，题目会直接显示文字。'}</div>
    </div>
    <div class="small">题目来自练习稿（${esc(DATA.built)} 生成）。对错记录只存在这台手机上。</div>`;
  document.querySelectorAll('[data-go]').forEach(b => b.onclick = () => start(b.dataset.go));
  $('#test').onclick = () => speak('大阪経済大学を志望した理由を教えてください。');
}
function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function start(kind) {
  let its = DATA.items;
  if (kind === 'must' || kind === 'maybe') its = its.filter(it => it.g === kind);
  if (kind === 'wrong') its = its.filter(it => store[it.id] && store[it.id].ok === false);
  if (!its.length) return home();
  S = {kind, queue: shuffle(its.map(it => it.id)), pos: 0, again: {}, firstTry: {}, answer: ''};
  ask();
}
function header() {
  const total = S.queue.length, pct = Math.round(S.pos / total * 100);
  return `<div class="top"><span>第 ${S.pos + 1} 题 / 共 ${total} 题</span><button class="ghost" id="quit">回首页</button></div>
    <div class="bar"><i style="width:${pct}%"></i></div>`;
}
function ask() {
  const it = byId[S.queue[S.pos]];
  $('#app').innerHTML = header() + `
    <div class="card listen">
      ${canSpeak ? `<div class="q">（听题目）</div><div class="hint">题目只播放声音，交卷后才显示文字</div>`
                 : `<div class="q">${esc(it.q)}</div>`}
      <div class="row" style="margin-top:14px">
        <button class="ghost" id="replay" ${canSpeak ? '' : 'disabled'}>再听一遍</button>
        <button class="ghost" id="slow" ${canSpeak ? '' : 'disabled'}>慢速再听</button>
      </div>
    </div>
    <textarea id="ans" lang="ja" placeholder="用日语打出你的回答" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false"></textarea>
    <div class="row" style="margin-top:12px">
      <button class="ghost" id="giveup">不会，看答案</button>
      <button id="submit">交卷</button>
    </div>`;
  $('#quit').onclick = home;
  $('#replay').onclick = () => speak(it.q, 1);
  $('#slow').onclick = () => speak(it.q, 0.7);
  $('#giveup').onclick = () => result(it, '', true);
  $('#submit').onclick = () => { const v = $('#ans').value.trim(); if (v) result(it, v, false); else $('#ans').focus(); };
  $('#ans').addEventListener('keydown', e => { if (e.key === 'Enter' && (e.metaKey || e.ctrlKey)) $('#submit').click(); });
  speak(it.q, 1);
}
const TAG = {ok: '对', ok2: '对（有一点不一样）', mid: '差一点', ng: '没写到'};
function result(it, answer, gaveUp) {
  if (canSpeak) speechSynthesis.cancel();
  const g = gaveUp ? it.chunks.map(t => ({t, level: 'ng', mine: ''})) : grade(it, answer);
  const pass = g.every(x => x.level === 'ok' || x.level === 'ok2');
  const nOk = g.filter(x => x.level === 'ok' || x.level === 'ok2').length;
  if (!(it.id in S.firstTry)) S.firstTry[it.id] = pass;
  store[it.id] = {ok: pass, n: ((store[it.id] && store[it.id].n) || 0) + 1, t: Date.now()};
  save();
  let requeued = false;
  if (!pass && (S.again[it.id] || 0) < 2) {
    S.again[it.id] = (S.again[it.id] || 0) + 1;
    S.queue.splice(Math.min(S.pos + 4, S.queue.length), 0, it.id);
    requeued = true;
  }
  const rows = g.map(x => `
    <div class="chunk c-${x.level === 'ok2' ? 'ok' : x.level}">
      <span class="tag">${TAG[x.level]}</span><span class="t">${esc(x.t)}</span>
      ${(x.level === 'ok2' || x.level === 'mid') && x.mine ? `<div class="yours">你写的：${esc(x.mine)}</div>` : ''}
    </div>`).join('');
  $('#app').innerHTML = header() + `
    <div class="card">
      <div class="verdict ${pass ? 'v-ok' : 'v-ng'}">${pass ? '过了' : '还没记住'}　${nOk} / ${g.length}</div>
      ${requeued ? '<div class="small">这题过几题再考一次。</div>' : ''}
      <div class="label">题目</div><div class="q">${esc(it.q)}</div>
      <div class="row" style="margin-top:8px"><button class="ghost" id="replay">再听一遍题目</button></div>
      <div class="label">要说到的句子</div>${rows}
      <div class="label">稿子原文（粗体是要说到的）</div><div class="model">${it.html}</div>
      ${answer ? `<div class="label">你的回答</div><div class="mine">${esc(answer)}</div>` : ''}
    </div>
    <button class="big" id="next">${S.pos + 1 < S.queue.length ? '下一题' : '看这一轮的结果'}</button>`;
  $('#quit').onclick = home;
  $('#replay').onclick = () => speak(it.q, 1);
  $('#next').onclick = () => { S.pos++; if (S.pos < S.queue.length) ask(); else summary(); };
  window.scrollTo(0, 0);
}
function summary() {
  const ids = Object.keys(S.firstTry), first = ids.filter(id => S.firstTry[id]).length;
  const wrong = ids.filter(id => store[id] && store[id].ok === false);
  $('#app').innerHTML = `
    <h1>这一轮结束</h1>
    <div class="card">
      <div class="verdict">一次就过：${first} / ${ids.length} 题</div>
      ${wrong.length ? `<div class="label">最后一次还没过的</div><ul class="wrong">${wrong.map(id => `<li>${esc(byId[id].q)}</li>`).join('')}</ul>`
                     : '<div class="small">全部都过了。</div>'}
    </div>
    <div class="col">
      ${wrong.length ? '<button class="big" id="redo">错的再练一遍</button>' : ''}
      <button class="big ghost" id="home">回首页</button>
    </div>`;
  if (wrong.length) $('#redo').onclick = () => start('wrong');
  $('#home').onclick = home;
}
home();
</script>
