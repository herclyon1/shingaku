<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>面接の単語</title>
<style>
:root{--bg:#f7f6f2;--fg:#1d1d1f;--mute:#6e6e73;--line:#e2dfd7;--card:#fff;--mark:#ffe9a8;--rt:#b3261e;--accent:#2f5d8a;--dot:#aaa59a}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#161618;--fg:#ececef;--mute:#9a9aa2;--line:#2c2c31;--card:#1f1f23;--mark:#5c4a10;--rt:#ff9a8f;--accent:#8fb8e8;--dot:#5c5c63}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.6 -apple-system,"Hiragino Sans","Noto Sans JP","PingFang SC",sans-serif}
header{position:sticky;top:0;z-index:2;background:var(--bg);border-bottom:1px solid var(--line)}
.wrap{max-width:720px;margin:0 auto;padding:0 16px}
.top{display:flex;align-items:center;gap:8px;padding-top:10px;padding-bottom:10px}
h1{font-size:17px;margin:0;flex:1}
.tabs button,.tools button{font:inherit;font-size:14px;border:1px solid var(--line);background:var(--card);color:var(--fg);border-radius:999px;padding:5px 12px;cursor:pointer}
.tabs button[aria-pressed=true]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.hint{font-size:13px;color:var(--mute);margin:12px 0 4px}
h2{font-size:14px;color:var(--mute);font-weight:600;margin:22px 0 8px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin:0 0 10px}
.qh{display:flex;gap:8px;align-items:baseline}
.no{font-size:13px;color:var(--accent);font-weight:700;min-width:1.6em}
.qj{font-weight:700;font-size:17px;line-height:2.3}
.zh{font-size:13px;color:var(--mute);margin:0 0 4px 2.1em}
ul.a{margin:4px 0 0;padding:0 0 0 2.1em;list-style:none}
ul.a li{font-size:17px;line-height:2.3;position:relative}
ul.a li::before{content:"";position:absolute;left:-14px;top:1.05em;width:5px;height:5px;border-radius:50%;background:var(--dot)}
.w{position:relative;white-space:nowrap;cursor:pointer;border-bottom:1px dotted var(--dot);border-radius:3px;-webkit-tap-highlight-color:transparent}
.w.on{background:var(--mark);border-bottom-color:transparent}
.w.on::after{content:attr(data-y);position:absolute;left:50%;transform:translateX(-50%);top:-1.3em;font-size:.55em;line-height:1;color:var(--rt);font-weight:600;white-space:nowrap;pointer-events:none}
.tools{display:flex;gap:8px;margin:14px 0 10px}
ol.list{list-style:none;margin:0;padding:0}
ol.list li{display:flex;align-items:baseline;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 14px;margin:0 0 8px;cursor:pointer}
.lw{font-size:20px;font-weight:700}
.lr{font-size:16px;color:var(--rt);flex:1}
.ln{font-size:12px;color:var(--mute);white-space:nowrap}
.hide .lr{color:transparent;background:var(--line);border-radius:4px}
.hide li.peek .lr{color:var(--rt);background:none}
.empty{color:var(--mute);font-size:14px;padding:24px 0}
footer{font-size:12px;color:var(--mute);padding:24px 0 40px}
[hidden]{display:none!important}
</style>
</head>
<body>
<header><div class="wrap top">
  <h1>面接の単語</h1>
  <div class="tabs"><button id="t-qa" aria-pressed="true">问答</button> <button id="t-list" aria-pressed="false">要记的词 <span id="cnt">0</span></button></div>
</div></header>
<div class="wrap">
  <main id="qa"><p class="hint">点带虚线的词 → 标上假名，收进「要记的词」。再点一下就取消。</p></main>
  <main id="list" hidden>
    <div class="tools"><button id="b-hide" aria-pressed="false">遮住假名</button><button id="b-clear">清空</button></div>
    <ol class="list" id="ol"></ol>
    <p class="empty" id="empty">还没有标记的词。在「问答」里点词，就会出现在这里。</p>
  </main>

</div>
